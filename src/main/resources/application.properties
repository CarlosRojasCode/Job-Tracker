# Conexión a PostgreSQL (corriendo en Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/jobtracker
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=jobtracker_user
spring.datasource.password=jobtracker_pass

# Le decimos a Hibernate (el motor que traduce Java <-> SQL) que cree/actualice
# las tablas automáticamente según nuestras Entidades. Muy útil en desarrollo.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Muestra por consola el SQL que se ejecuta, para que veas qué está pasando por dentro
spring.jpa.show-sql=true